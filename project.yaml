id: signal_lab
name: signal lab
description: an interactive sandbox for synthetic sensor data and target tracking, where moving targets give noisy or missing detections and a Kalman filter's estimated tracks are compared with them and with the ground truth, with the simulation and tracking in C++ running as WebAssembly in the browser
status: active
tags: [c++, webassembly, kalman-filter, target-tracking]

